; Minimal standalone dmfmc example. Assumes every FMC signal pin has already
; been muxed to its alternate function elsewhere (see configs/board/*/sdram.ini
; for a complete, board-specific example including the GPIO pin sections).

[dmfmc]
memory_type=sdram
chip=MT48LC4M32B2
bank=1
data_bus_width=32
timeout_ms=3000
heap_usage=heap
heap_alignment=4
