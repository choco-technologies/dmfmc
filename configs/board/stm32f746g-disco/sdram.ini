; The FMC/SDRAM controller itself, brought up only after all pins above
; have been muxed (driver_order enforces GPIO-before-FMC ordering, the same
; convention dmuart uses for its TX/RX pins).
[sdram]
driver_name=dmfmc
driver_order=2
memory_type=sdram
chip=MT48LC4M32B2
bank=1
data_bus_width=32
timeout_ms=3000
heap_usage=heap
heap_alignment=4
