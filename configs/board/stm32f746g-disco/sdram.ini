; STM32F746G-DISCO external SDRAM (Micron MT48LC4M32B2, 128 Mbit, 4M x 32)
; Connected to FMC SDRAM Bank 1 (SDCKE0/SDNE0), all pins on Alternate Function 12.
; Pin mapping matches ST's stm32746g_discovery_sdram BSP.
;
; Only a 16-bit data bus (D0-D15) is used, NOT the chip's native 32-bit width:
; on this specific board D16-D31 are shared with other on-board peripherals
; (confirmed against a previously working driver for this exact board - see
; oc_pinsmap.h / fmc_test/fmc.c in the chocos repository, which mark FMC_DQ16
; through FMC_DQ31 as NotUsed and explicitly force DataBusWidth to 16-bit for
; this reason). Configuring data_bus_width=32 here drives/expects pins that
; are not actually wired to the SDRAM chip on this board, corrupting every
; access with garbage from the floating upper half.

; Pins: one dmgpio section per GPIO port, every pin of the port that the
; SDRAM uses selected by the pins= bitmask (bit n = pin n) - all of them share
; the same settings (AF12, maximum speed, push-pull).
;
; D16-D31 deliberately not configured here - see the note at the top of this
; file. Those MCU pins (PH8-15, PI0-3, PI6-7, PI9-10) are used for other
; on-board peripherals and must not be muxed to FMC on this board.

; Port C: SDCKE0=PC3
[sdram_port_c]
driver_name=dmgpio
driver_order=-9
port=C
pins=0x0008
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

; Port D: D2=PD0, D3=PD1, D13=PD8, D14=PD9, D15=PD10, D0=PD14, D1=PD15
[sdram_port_d]
driver_name=dmgpio
driver_order=-9
port=D
pins=0xC703
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

; Port E: NBL0=PE0, NBL1=PE1, D4=PE7, D5=PE8, D6=PE9, D7=PE10, D8=PE11,
; D9=PE12, D10=PE13, D11=PE14, D12=PE15
[sdram_port_e]
driver_name=dmgpio
driver_order=-9
port=E
pins=0xFF83
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

; Port F: A0=PF0, A1=PF1, A2=PF2, A3=PF3, A4=PF4, A5=PF5, SDNRAS=PF11,
; A6=PF12, A7=PF13, A8=PF14, A9=PF15
[sdram_port_f]
driver_name=dmgpio
driver_order=-9
port=F
pins=0xF83F
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

; Port G: A10=PG0, A11=PG1, BA0=PG4, BA1=PG5, SDCLK=PG8, SDNCAS=PG15
[sdram_port_g]
driver_name=dmgpio
driver_order=-9
port=G
pins=0x8133
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

; Port H: SDNE0=PH3, SDNWE=PH5
[sdram_port_h]
driver_name=dmgpio
driver_order=-9
port=H
pins=0x0028
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

; Port I: NBL2=PI4, NBL3=PI5
[sdram_port_i]
driver_name=dmgpio
driver_order=-9
port=I
pins=0x0030
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

; The FMC/SDRAM controller itself, brought up only after all pins above
; have been muxed (driver_order enforces GPIO-before-FMC ordering, the same
; convention dmuart uses for its TX/RX pins). The orders are negative so the
; external SDRAM comes up right after dmclk (-10) and before every driver
; with the default order 0 - otherwise the early drivers exhaust DTCM before
; the SDRAM heap is available.
[sdram]
driver_name=dmfmc
driver_order=-8
memory_type=sdram
chip=MT48LC4M32B2
bank=1
data_bus_width=16
timeout_ms=3000
heap_usage=heap
heap_alignment=4
