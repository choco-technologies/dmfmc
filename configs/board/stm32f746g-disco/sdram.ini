; STM32F746G-DISCO external SDRAM (Micron MT48LC4M32B2, 128 Mbit, 4M x 32)
; Connected to FMC SDRAM Bank 1 (SDCKE0/SDNE0), all pins on Alternate Function 12.
; Pin mapping matches ST's stm32746g_discovery_sdram BSP.
;
; Only a 16-bit data bus (D0-D15) is used, NOT the chip's native 32-bit width:
; on this specific board D16-D31 are shared with other on-board peripherals
; (confirmed against a previously working driver for this exact board - see
; oc_pinsmap.h / fmc_test/fmc.c in the chocos repository, which mark FMC_DQ16
; through FMC_DQ31 as NotUsed and explicitly force DataBusWidth to 16-bit for
; this reason). Configuring data_bus_width=32 here drives/expects pins that
; are not actually wired to the SDRAM chip on this board, corrupting every
; access with garbage from the floating upper half.

[sdram_sdclk]
driver_name=dmgpio
driver_order=-9
pin=PG8
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

[sdram_sdcke0]
driver_name=dmgpio
driver_order=-9
pin=PC3
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull

